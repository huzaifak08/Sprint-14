name: Sprint 14 Build & Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Decode Keystore
        # -di ignores wraps and non-alphabet characters to prevent "invalid input"
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > android/app/upload-keystore.jks

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Artifacts
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Math performed inside the shell script to avoid YAML syntax issues
          # If your current Play Store build is 2, this makes the next one 22
          BUILD_NUMBER=$((RUN_NUMBER + 20))

          # Build App Bundle for Play Store
          flutter build appbundle --release \
            --build-name=0.0.2 \
            --build-number=$BUILD_NUMBER

          # Build APK for GitHub Release
          flutter build apk --release \
            --build-name=0.0.2 \
            --build-number=$BUILD_NUMBER

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          tag_name: v0.0.2-b${{ github.run_number }}
          name: Sprint 14 v0.0.2 (Build ${{ github.run_number }})
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Play Store (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          packageName: com.zaifii.sprint_14
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
          metadataDirectory: android/fastlane/metadata/android
