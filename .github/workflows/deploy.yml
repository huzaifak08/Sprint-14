name: Digital Munshi Build

# Every push to master (or a manual run) checks, tests and builds a signed
# release, then attaches the .aab/.apk to a GitHub release. Upload the .aab
# to Play Console yourself (Production or a testing track).
#
# Version NAME comes from pubspec.yaml; version CODE is the workflow run
# number, so it always increases.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refuse to release with the temporary dev config (new package pointing
      # at another app's Firebase id). Register com.digitalmunshi.app in
      # Firebase and commit its real google-services.json first.
      - name: Check Firebase config
        run: |
          python3 - <<'PY'
          import json, sys
          clients = json.load(open("android/app/google-services.json"))["client"]
          ids = {}
          for c in clients:
              info = c["client_info"]
              ids.setdefault(info["mobilesdk_app_id"], []).append(
                  info["android_client_info"]["package_name"])
          mine = [c for c in clients
                  if c["client_info"]["android_client_info"]["package_name"] == "com.digitalmunshi.app"]
          if not mine:
              sys.exit("::error::google-services.json has no client for com.digitalmunshi.app")
          if len(ids[mine[0]["client_info"]["mobilesdk_app_id"]]) > 1:
              sys.exit("::error::google-services.json uses a TEMPORARY copied client for "
                       "com.digitalmunshi.app. Register the app in Firebase (see RELEASE.md).")
          print("Firebase config OK")
          PY

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing. See RELEASE.md (GitHub secrets)."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Don't ship a build that fails analysis or tests.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test

      - name: Decode Keystore
        # -di ignores wraps and non-alphabet characters to prevent "invalid input"
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -di > android/app/upload-keystore.jks

      - name: Resolve version
        id: version
        run: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $BUILD_NAME (${{ github.run_number }})"

      - name: Build Artifacts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/mapping/release/mapping.txt
          tag_name: v${{ steps.version.outputs.name }}-b${{ steps.version.outputs.code }}
          name: Digital Munshi v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }})
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
